; Seeed Xiao BLE: https://wiki.seeedstudio.com/XIAO_BLE/
[env:seeed_xiao_nrf52840_kit]
custom_meshtastic_hw_model = 88
custom_meshtastic_hw_model_slug = XIAO_NRF52_KIT
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed Xiao NRF52840 Kit
custom_meshtastic_images = seeed_xiao_nrf52_kit.svg
custom_meshtastic_tags = Seeed

extends = nrf52840_base
board = xiao_ble_sense
board_level = pr
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/seeed_xiao_nrf52840_kit
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  -DSEEED_XIAO_NRF52840_KIT
  -DSEEED_XIAO_NRF_KIT_DEFAULT
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_xiao_nrf52840_kit>
debug_tool = jlink
; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
;upload_protocol = jlink

; Seeed Xiao BLE but with GPS moved to NFC pins, and therefore i2c active
[env:seeed_xiao_nrf52840_kit_i2c]
extends = env:seeed_xiao_nrf52840_kit
board_level = extra
build_flags = ${env:seeed_xiao_nrf52840_kit.build_flags}
  -DSEEED_XIAO_NRF52840_KIT
  -DSEEED_XIAO_NRF_KIT_I2C     ; Define I2C variant
  -USEEED_XIAO_NRF_KIT_DEFAULT ; Remove default define

[env:xiao_nrf52840_almemo_sensor_receiver]
extends = env:seeed_xiao_nrf52840_kit_i2c
board_level = extra
build_flags = ${env:seeed_xiao_nrf52840_kit_i2c.build_flags}
  -DALMEMO_SENSOR_RECEIVER
  ;if activated values are emulated, if not, received values from mesh are used
  ;-DALMEMO_EMULATOR
  -DMESHTASTIC_EXCLUDE_BLUETOOTH  
  -DMESHTASTIC_EXCLUDE_I2C
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR
  ;PIN 43, P1.11, TX, D6 :
  -DI2C_SDA=43  
  ;PIN 44, P1.12, RX, D7 :
  -DI2C_SCL=44
  -DI2C_BB_OWN_IRQ
  -Wl,--allow-multiple-definition

; ALMEMO sensor sender: acts as I2C master, reads SHT85 via standard Meshtastic I2C stack.
; I2C on D6 (SDA) / D7 (SCL) — inherited from seeed_xiao_nrf52840_kit_i2c.
; src/custom/ (I2C slave + bitbang driver) is excluded from this build.
[env:xiao_nrf52840_almemo_sensor_sender]
extends = env:seeed_xiao_nrf52840_kit_i2c
board_level = extra
build_flags = ${env:seeed_xiao_nrf52840_kit_i2c.build_flags}
  -DALMEMO_SENSOR_SENDER
  ;if activated values are emulated, if not, real SHT readings are sent
  ;-DALMEMO_EMULATOR
  -DMESHTASTIC_EXCLUDE_BLUETOOTH
  -DMESHTASTIC_EXCLUDE_GPS
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY
  -DNRF52_USE_DCDC
  ; --- WeAct Studio 1.54" 200x200 e-paper (GxEPD2_154_D67) ---
  ; SPI bus shared with the LoRa radio (SCK=D8, MOSI=D10); MISO unused by e-paper.
  ; Control lines on the freed-up PDM-mic pads (mic not populated):
  ;   CS   = Arduino 19 -> P1.10 (ex MIC_PWR)
  ;   DC   = Arduino 20 -> P1.00 (ex PDM_CLK)
  ;   BUSY = Arduino 21 -> P0.16 (ex PDM_DATA)
  ;   RST  = Arduino 31 -> P0.10 (NFC2, 2. NFC-Pad); benoetigt NFC-als-GPIO
  ; NFC-Pins als GPIO freigeben (schreibt einmalig UICR -> Reset beim 1. Boot):
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
  -DALMEMO_EINK
  -DALMEMO_EINK_CS=19
  -DALMEMO_EINK_DC=20
  -DALMEMO_EINK_BUSY=21
  -DALMEMO_EINK_RST=31
lib_deps =
  ${nrf52840_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/55f618961db45a23eff0233546430f1e5a80f63a.zip
