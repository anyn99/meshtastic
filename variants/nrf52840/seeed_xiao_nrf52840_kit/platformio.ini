; Seeed Xiao BLE: https://wiki.seeedstudio.com/XIAO_BLE/
[env:seeed_xiao_nrf52840_kit]
custom_meshtastic_hw_model = 88
custom_meshtastic_hw_model_slug = XIAO_NRF52_KIT
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed Xiao NRF52840 Kit
custom_meshtastic_images = seeed_xiao_nrf52_kit.svg
custom_meshtastic_tags = Seeed

extends = nrf52840_base
board = xiao_ble_sense
board_level = pr
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/seeed_xiao_nrf52840_kit
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  -DSEEED_XIAO_NRF52840_KIT
  -DSEEED_XIAO_NRF_KIT_DEFAULT
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_xiao_nrf52840_kit>
debug_tool = jlink
; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
;upload_protocol = jlink

; Seeed Xiao BLE but with GPS moved to NFC pins, and therefore i2c active
[env:seeed_xiao_nrf52840_kit_i2c]
extends = env:seeed_xiao_nrf52840_kit
board_level = extra
build_flags = ${env:seeed_xiao_nrf52840_kit.build_flags}
  -DSEEED_XIAO_NRF52840_KIT
  -DSEEED_XIAO_NRF_KIT_I2C     ; Define I2C variant
  -USEEED_XIAO_NRF_KIT_DEFAULT ; Remove default define

[env:xiao_nrf52840_almemo_sensor_receiver]
extends = env:seeed_xiao_nrf52840_kit_i2c
board_level = extra
build_flags = ${env:seeed_xiao_nrf52840_kit_i2c.build_flags}
  -DALMEMO_SENSOR_RECEIVER
  ;if activated values are emulated, if not, received values from mesh are used
  ;-DALMEMO_EMULATOR
  -DMESHTASTIC_EXCLUDE_BLUETOOTH  
  -DMESHTASTIC_EXCLUDE_I2C
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR
  ;PIN 43, P1.11, TX, D6 :
  -DI2C_SDA=43  
  ;PIN 44, P1.12, RX, D7 :
  -DI2C_SCL=44
  -DI2C_BB_OWN_IRQ
  -Wl,--allow-multiple-definition

; ALMEMO sensor sender: acts as I2C master, reads SHT85 via standard Meshtastic I2C stack.
; I2C on D6 (SDA) / D7 (SCL) — inherited from seeed_xiao_nrf52840_kit_i2c.
; src/custom/ (I2C slave + bitbang driver) is excluded from this build.
; Basis-Variante: echte SHT-Messwerte werden gesendet, kein Emulator, kein E-Paper.
[env:xiao_nrf52840_almemo_sensor_sender]
extends = env:seeed_xiao_nrf52840_kit_i2c
board_level = extra
build_flags = ${env:seeed_xiao_nrf52840_kit_i2c.build_flags}
  -DALMEMO_SENSOR_SENDER
  -DMESHTASTIC_EXCLUDE_BLUETOOTH
  -DMESHTASTIC_EXCLUDE_GPS
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY
  -DNRF52_USE_DCDC
  ; Keine Power-/Startup-LED: PIN_LED1 wird in variant.h fuer ALMEMO_SENSOR_SENDER
  ; nicht definiert, dadurch bleibt LED_POWER undefiniert und beim Boot leuchtet
  ; keine LED.

; ALMEMO sender ohne echten Sensor: Werte werden emuliert (-DALMEMO_EMULATOR),
; ansonsten identisch zur Basis-Sender-Variante (kein E-Paper).
[env:xiao_nrf52840_almemo_sender_nosensor]
extends = env:xiao_nrf52840_almemo_sensor_sender
board_level = extra
build_flags = ${env:xiao_nrf52840_almemo_sensor_sender.build_flags}
  ;if activated values are emulated, if not, real SHT readings are sent
  -DALMEMO_EMULATOR

; ALMEMO sender mit E-Paper + Mux: echte SHT-Messwerte (kein Emulator),
; zusaetzlich WeAct 1.54" E-Paper-Anzeige.
[env:xiao_nrf52840_almemo_sender_epaper_mux]
extends = env:xiao_nrf52840_almemo_sensor_sender
board_level = extra
build_flags = ${env:xiao_nrf52840_almemo_sensor_sender.build_flags}
  ; --- WeAct Studio 1.54" 200x200 e-paper (GxEPD2_154_D67) ---
  ; SPI bus shared with the LoRa radio (SCK=D8, MOSI=D10); MISO unused by e-paper.
  ; Control lines on the freed-up PDM-mic pads (mic not populated):
  ;   DC   = Arduino 20 -> P1.00 (ex PDM_CLK)
  ;   CS   = Arduino 19 -> P1.10 (ex MIC_PWR)
  ;   BUSY = Arduino 21 -> P0.16 (ex PDM_DATA)
  ;   RST  = Arduino 31 -> P0.10 (NFC2, 2. NFC-Pad); benoetigt NFC-als-GPIO
  ; NFC-Pins als GPIO freigeben (schreibt einmalig UICR -> Reset beim 1. Boot):
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
  -DALMEMO_EINK
  ; Async Full-Refresh: GxEPD2 ueberspringt das ~2.6s BUSY-Warten in nextPage();
  ; wir pollen epd2.isBusy() selbst OHNE spiLock -> Radio bleibt am SPI-Bus dran.
  -DUSE_EINK_DYNAMICDISPLAY
  -DALMEMO_EINK_CS=19
  -DALMEMO_EINK_DC=20
  -DALMEMO_EINK_BUSY=21
  -DALMEMO_EINK_RST=31
lib_deps =
  ${nrf52840_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/55f618961db45a23eff0233546430f1e5a80f63a.zip

; ALMEMO D7 sender: bindet einen ALMEMO-D7-Sensor an, der I2C UND einen UART hat.
; Basiert auf SEEED_XIAO_NRF_KIT_DEFAULT (statt _i2c), weil das Default-Pinout
; genau die gewuenschte Aufteilung liefert:
;   - I2C (Wire)   auf den NFC-Pins  D30=P0.09 (SDA) / D31=P0.10 (SCL)
;   - UART (Serial1) auf D6=P1.11 (TX) / D7=P1.12 (RX)  -> ehem. GPS-UART
; NFC-Pins als GPIO freigeben (schreibt einmalig UICR -> Reset beim 1. Boot),
; sonst sind P0.09/P0.10 NFC-Antenne und I2C funktioniert nicht.
; Interne I2C-Pullups werden von Wire_nRF52 automatisch aktiviert (~13k, S0D1);
; fuer ein reales Sensorkabel zusaetzlich externe 4.7k nach 3V3 empfohlen.
[env:xiao_nrf52840_almemo_sensor_sender_D7]
extends = env:seeed_xiao_nrf52840_kit
board_level = extra
build_flags = ${env:seeed_xiao_nrf52840_kit.build_flags}
  -DALMEMO_SENSOR_SENDER
  -DALMEMO_SENSOR_D7
  -DMESHTASTIC_EXCLUDE_BLUETOOTH
  ; GPS-Modul aus -> der GPS-UART (Serial1, D6/D7) bleibt fuer ALMEMO D7 frei.
  -DMESHTASTIC_EXCLUDE_GPS
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY
  -DNRF52_USE_DCDC
  ; NFC-Pins (D30/D31) als GPIO -> I2C auf den NFC-Pins moeglich:
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
  ; Keine Power-/Startup-LED (PIN_LED1 wird in variant.h fuer ALMEMO_SENSOR_SENDER
  ; nicht definiert).

; ALMEMO D7 sender + I2C-OLED (SSD1306 @ 0x3C) + Taster an D0.
; Das OLED ERSETZT das E-Paper -- ALMEMO_EINK wird hier bewusst nicht gesetzt.
;
; Eigene Anzeige mit eigenem Menue (src/custom/AlmemoOledDisplay.h), daher:
;   - MESHTASTIC_EXCLUDE_SCREEN ist Pflicht: sonst erkennt der I2C-Scan die
;     0x3C und graphics::Screen faehrt dasselbe Panel parallel hoch (zwei
;     Treiber auf einem Display).
;   - Taster ueber ALMEMO_BUTTON_PIN, NICHT ueber BUTTON_PIN: der
;     UserButtonThread wuerde denselben Pin belegen (zwei Besitzer von D0)
;     und bei langem Halten das Geraet runterfahren (INPUT_BROKER_SHUTDOWN).
;   - D0 ist frei, weil MESHTASTIC_EXCLUDE_GPS den Konflikt mit
;     PIN_GPS_STANDBY (variant.h) entschaerft. Taster nach GND, interner
;     Pullup -> OneButton(pin, activeLow=true, pullupActive=true).
;
; I2C-Bustakt bleibt auf 100 kHz: AlmemoOledDisplay baut seine SSD1306Wire-
; Instanz mit frequency = -1, dann laesst connect() das setClock(700000) aus,
; das Wire_nRF52 sonst auf 400 kHz klemmen wuerde. Pflicht wegen des
; Levelumsetzers auf der ALMEMO-Sensorleitung.
;
; Reiner Hardware-Test ohne eigenen Code (ist durch, Display+Taster laufen):
; die vier Flags unten durch nur -DBUTTON_PIN=0 ersetzen -> graphics::Screen
; zieht das Panel ueber AutoOLEDWire hoch und zeigt die Meshtastic-Standard-UI.
; ACHTUNG: das zieht den Bus auf 400 kHz, also nur OHNE ALMEMO-Sensor.
[env:xiao_nrf52840_almemo_sender_D7_oled]
extends = env:xiao_nrf52840_almemo_sensor_sender_D7
board_level = extra
build_flags = ${env:xiao_nrf52840_almemo_sensor_sender_D7.build_flags}
  -DALMEMO_OLED
  -DALMEMO_OLED_ADDR=0x3C
  ; D0 = Arduino-Pin 0
  -DALMEMO_BUTTON_PIN=0
  -DMESHTASTIC_EXCLUDE_SCREEN
  ; Muss zusammen mit EXCLUDE_SCREEN gesetzt werden: main.cpp inkludiert
  ; input/InputBroker.h nie selbst, sondern bekommt die Deklaration transitiv
  ; ueber graphics/Screen.h -- und dieser Include liegt dort im HAS_SCREEN-Zweig.
  ; Ohne Screen fehlt die Deklaration, die Benutzung in main.cpp haengt aber an
  ; MESHTASTIC_EXCLUDE_INPUTBROKER -> "'inputBroker' was not declared".
  ; Inhaltlich ohnehin richtig: der Taster laeuft hier ueber die eigene
  ; OneButton-Instanz in AlmemoOledDisplay, nicht ueber den InputBroker.
  -DMESHTASTIC_EXCLUDE_INPUTBROKER=1
  ;nächste Zeile nur zum Testen des Schalters und Display! deaktiviert lassen!
  ;-DBUTTON_PIN=0
